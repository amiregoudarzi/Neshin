services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neshin
      POSTGRES_USER: neshin
      POSTGRES_PASSWORD: neshin_dev
    ports:
      - "5432:5432"
    volumes:
      - neshin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neshin -d neshin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neshin-postgres:
